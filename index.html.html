<style>
  :root{
    --blue: #3E4095;
    --blue-dark: #2C2D6B;
    --ink: #1A1C29;
    --slate: #667085;
    --steel: #F4F5F8;
    --panel: #FFFFFF;
    --line: #E1E3F0;
    --green: #1F8A57;
    --green-bg: #E8F5EE;
    --amber: #C6790F;
    --amber-bg: #FBF0DD;
    --rust: #C4432E;
    --rust-bg: #FBE7E3;
    --radius: 6px;
    --shadow: 0 1px 2px rgba(26,28,41,.06), 0 1px 12px rgba(26,28,41,.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--steel);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.01em;
    margin:0;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:15px;}

  /* ---------- topbar ---------- */
  .topbar{
    background:linear-gradient(180deg,var(--blue) 0%, var(--blue-dark) 100%);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 10px rgba(44,45,107,.25);
  }
  .topbar .brand{display:flex;align-items:center;gap:14px;}
  .topbar img.logo{height:26px;display:block;}
  .topbar .divider{width:1px;height:22px;background:rgba(255,255,255,.25);}
  .topbar .subtitle{
    color:rgba(255,255,255,.85);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:.03em;
    text-transform:uppercase;
  }
  .storage-flag{
    font-size:11.5px;
    color:rgba(255,255,255,.7);
    border:1px solid rgba(255,255,255,.3);
    padding:3px 9px;
    border-radius:20px;
  }
  .storage-flag.ok{color:#B9F0D2;border-color:rgba(185,240,210,.4);}
  .storage-flag.warn{color:#FBD9A8;border-color:rgba(251,217,168,.4);}

  /* ---------- tabs ---------- */
  .tabbar{
    max-width:1180px;margin:0 auto;padding:18px 24px 0;
    display:flex;gap:6px;
  }
  .tab{
    background:transparent;border:none;
    padding:11px 20px;
    font-family:'Oswald',sans-serif;
    font-size:14.5px;
    letter-spacing:.02em;
    color:var(--slate);
    border-radius:var(--radius) var(--radius) 0 0;
    border:1px solid transparent;
    border-bottom:none;
    position:relative;
    top:1px;
  }
  .tab.active{
    background:var(--panel);
    color:var(--blue);
    border-color:var(--line);
    font-weight:600;
  }
  .tab:not(.active):hover{color:var(--ink);}

  .content{
    max-width:1180px;margin:0 auto;padding:0 24px 60px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:28px;
    box-shadow:var(--shadow);
  }

  /* ---------- form ---------- */
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  label{
    font-size:12.5px;font-weight:600;color:var(--slate);
    text-transform:uppercase;letter-spacing:.04em;
  }
  input[type=text],input[type=tel],input[type=date],select,textarea{
    border:1px solid var(--line);
    border-radius:5px;
    padding:10px 12px;
    color:var(--ink);
    background:#fff;
    outline:none;
    transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--blue);}
  .hint{font-size:12px;color:var(--slate);font-weight:400;text-transform:none;letter-spacing:0;}

  .section-title{
    font-size:15px;color:var(--blue);
    display:flex;align-items:center;gap:8px;
    margin:26px 0 12px;
    padding-top:20px;border-top:1px solid var(--line);
  }
  .section-title:first-child{border-top:none;padding-top:0;margin-top:0;}

  /* item manifest table — echoes the paper form */
  table.manifest{width:100%;border-collapse:collapse;margin-bottom:8px;}
  table.manifest th{
    background:var(--steel);
    font-family:'Oswald',sans-serif;
    font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;
    color:var(--slate);text-align:left;
    padding:8px 10px;border:1px solid var(--line);
  }
  table.manifest td{border:1px solid var(--line);padding:4px;}
  table.manifest td input{border:none;width:100%;padding:8px 10px;background:transparent;}
  table.manifest td input:focus{background:#fff;outline:1px solid var(--blue);}
  .col-qtd{width:70px;} .col-ref{width:120px;} .col-del{width:40px;text-align:center;}
  .row-del{background:none;border:none;color:var(--rust);font-size:16px;line-height:1;padding:6px;}
  .add-row{
    background:none;border:1px dashed var(--line);color:var(--blue);
    padding:8px 14px;border-radius:5px;font-size:13.5px;font-weight:600;
    margin-top:4px;
  }
  .add-row:hover{border-color:var(--blue);background:#F4F4FC;}

  .btn{
    border:none;border-radius:5px;padding:11px 20px;font-weight:600;font-size:14px;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-ghost{background:#fff;color:var(--blue);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--blue);}
  .btn-block{width:100%;justify-content:center;padding:13px;font-size:15px;margin-top:22px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  [data-tip]{position:relative;}
  [data-tip]::after{
    content:attr(data-tip);
    position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:12px;font-weight:500;
    padding:7px 10px;border-radius:5px;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .12s;
    z-index:50;line-height:1.3;max-width:240px;white-space:normal;text-align:center;
  }
  [data-tip]:hover::after{opacity:1;}

  /* ---------- dashboard ---------- */
  .filters{
    display:flex;gap:12px;flex-wrap:wrap;align-items:end;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);
  }
  .filters .field{min-width:160px;}
  .filters input,.filters select{padding:8px 10px;}

  .stat-strip{display:flex;gap:12px;margin-bottom:16px;}
  .stat{
    flex:1;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 18px;box-shadow:var(--shadow);
  }
  .stat .num{font-family:'Oswald';font-size:26px;color:var(--blue);}
  .stat .lbl{font-size:12px;color:var(--slate);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .stat.alert .num{color:var(--rust);}

  table.data{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  table.data th{
    background:var(--blue);color:#fff;text-align:left;padding:11px 14px;
    font-family:'Oswald';font-size:12px;letter-spacing:.03em;text-transform:uppercase;font-weight:500;
  }
  table.data td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle;}
  table.data tr:last-child td{border-bottom:none;}
  table.data tr:hover td{background:#FAFAFD;}
  .row-click{cursor:pointer;}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;}
  .badge .dot{width:7px;height:7px;border-radius:50%;}
  .badge.confirmado{background:var(--green-bg);color:var(--green);}
  .badge.confirmado .dot{background:var(--green);}
  .badge.pendente{background:var(--amber-bg);color:var(--amber);}
  .badge.pendente .dot{background:var(--amber);}
  .badge.atrasado{background:var(--rust-bg);color:var(--rust);}
  .badge.atrasado .dot{background:var(--rust);}

  .empty{padding:60px 20px;text-align:center;color:var(--slate);}
  .empty .display{color:var(--ink);font-size:18px;margin-bottom:6px;}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(26,28,41,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:100;}
  .modal{background:#fff;border-radius:8px;max-width:620px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-head{background:var(--blue);color:#fff;padding:18px 24px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center;}
  .modal-body{padding:24px;max-height:70vh;overflow:auto;}
  .modal-close{background:none;border:none;color:#fff;font-size:22px;line-height:1;opacity:.8;}
  .modal-close:hover{opacity:1;}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

  .send-options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;}
  .send-card{border:1px solid var(--line);border-radius:6px;padding:16px;text-align:center;}
  .send-card .ic{font-size:26px;margin-bottom:8px;}
  .send-card h3{font-size:13.5px;margin-bottom:4px;}
  .send-card p{font-size:12px;color:var(--slate);margin:0 0 12px;}
  #qr-canvas-wrap{display:flex;justify-content:center;padding:14px;background:#fff;}
  #qr-canvas-wrap{position:relative;}
  .qr-logo-overlay{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:34px;height:auto;background:#fff;padding:3px;border-radius:4px;
  }

  .detail-item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .detail-item:last-child{border-bottom:none;}
  .detail-item .k{color:var(--slate);}
  .detail-item .v{font-weight:600;text-align:right;}

  /* ---------- confirmation view ---------- */
  .confirm-wrap{max-width:520px;margin:0 auto;padding:24px 18px 60px;}
  .confirm-warning{
    background:linear-gradient(135deg, var(--rust), #A8321F);
    color:#fff;border-radius:8px;padding:18px 20px;margin-bottom:18px;
    display:flex;gap:14px;align-items:flex-start;
    box-shadow:0 8px 24px rgba(196,67,46,.3);
  }
  .confirm-warning .ic{font-size:26px;line-height:1;}
  .confirm-warning h2{color:#fff;font-size:16px;margin-bottom:4px;}
  .confirm-warning p{margin:0;font-size:13px;opacity:.95;}

  .sig-pad-wrap{border:1.5px dashed var(--line);border-radius:6px;background:#fcfcfd;}
  canvas#sigpad{width:100%;height:160px;display:block;touch-action:none;cursor:crosshair;}
  .sig-actions{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-top:1px solid var(--line);}
  .sig-actions button{background:none;border:none;color:var(--blue);font-size:12.5px;font-weight:600;}

  .success-box{text-align:center;padding:50px 20px;}
  .success-box .ic{font-size:52px;color:var(--green);margin-bottom:14px;}
  .success-box h2{font-size:20px;margin-bottom:8px;}
  .success-box p{color:var(--slate);}

  @media (max-width:760px){
    .field-row{grid-template-columns:1fr;}
    .send-options{grid-template-columns:1fr;}
    .filters{flex-direction:column;align-items:stretch;}
  }

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;top:0;left:0;width:100%;padding:20px;}
  }
</style>
</head>

/* =========================================================
   ESTADO / PERSISTÊNCIA
   ========================================================= */
let STATE = { counter: 0, records: [], publicUrl: '' };
let STORAGE_MODE = "checking"; // 'shared' | 'local'

async function loadState(){
  try{
    const res = await window.storage.get('detronic_remessas_state_v1', true);
    if(res && res.value){ STATE = Object.assign({counter:0, records:[], publicUrl:''}, JSON.parse(res.value)); }
    STORAGE_MODE = "shared";
  }catch(e){
    STORAGE_MODE = "local";
  }
  updateStorageFlag();
}
async function saveState(){
  try{
    await window.storage.set('detronic_remessas_state_v1', JSON.stringify(STATE), true);
    STORAGE_MODE = "shared";
  }catch(e){
    STORAGE_MODE = "local";
  }
  updateStorageFlag();
}
function updateStorageFlag(){
  const el = document.getElementById('storage-flag');
  if(!el) return;
  if(STORAGE_MODE === "shared"){
    el.textContent = "Armazenamento ativo · dados salvos";
    el.className = "storage-flag ok";
  }else{
    el.textContent = "Modo local · sem persistência compartilhada";
    el.className = "storage-flag warn";
  }
}

/* =========================================================
   HELPERS
   ========================================================= */
function pad4(n){ return String(n).padStart(4,'0'); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR');
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function diasDesde(iso){
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
function getStatus(rec){
  if(rec.confirmacao) return 'confirmado';
  if(diasDesde(rec.createdAt) >= CONFIG.diasParaAtraso) return 'atrasado';
  return 'pendente';
}
function statusLabel(s){
  return {confirmado:'Confirmado', pendente:'Pendente', atrasado:'Atrasado'}[s];
}
function resumoItens(rec){
  if(!rec.itens.length) return '—';
  const first = rec.itens[0].discriminacao || '—';
  return rec.itens.length > 1 ? `${first} +${rec.itens.length-1}` : first;
}
function baseUrl(){
  return location.origin + location.pathname;
}
function hasPublicUrl(){
  return !!(STATE.publicUrl && STATE.publicUrl.trim());
}
function confirmLink(id){
  const base = hasPublicUrl() ? STATE.publicUrl.trim().replace(/\/+$/,'') : baseUrl();
  return base + '?id=' + id;
}
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }

/* =========================================================
   ROTEAMENTO SIMPLES
   ========================================================= */
let currentTab = 'nova';
function getUrlId(){
  const p = new URLSearchParams(location.search);
  return p.get('id');
}

function render(){
  const confirmId = getUrlId();
  if(confirmId){
    renderConfirmView(confirmId);
    document.getElementById('tabbar').innerHTML = '';
    return;
  }
  renderTabs();
  if(currentTab === 'nova') renderNovaRemessa();
  else renderPainel();
}

function renderTabs(){
  const tb = document.getElementById('tabbar');
  tb.innerHTML = `
    <button class="tab ${currentTab==='nova'?'active':''}" onclick="setTab('nova')">+ Nova Remessa</button>

async function criarRemessa(){
  const cliente = document.getElementById('f-cliente').value.trim();
  const data = document.getElementById('f-data').value;
  const entreguePor = document.getElementById('f-entreguePor').value.trim();
  const whats = document.getElementById('f-whats').value.trim();
  const itensValidos = draftItens.filter(it=>it.discriminacao.trim());

  if(!cliente){ alert('Informe o cliente/fornecedor.'); return; }
  if(!itensValidos.length){ alert('Adicione ao menos um item com descrição.'); return; }
  if(!entreguePor){ alert('Informe quem está entregando o material.'); return; }

  STATE.counter += 1;
  const rec = {
    id: STATE.counter,
    createdAt: new Date(data + 'T' + new Date().toTimeString().slice(0,8)).toISOString(),
    cliente, entreguePor,
    telefoneWhats: onlyDigits(whats),
    itens: itensValidos,
    confirmacao: null
  };
  STATE.records.unshift(rec);
  await saveState();

  draftItens = [{qtd:'1',ref:'',discriminacao:''}];
  openSendModal(rec.id);
}
window.criarRemessa = criarRemessa;

    colorDark: "#3E4095", colorLight: "#ffffff",

          <option value="">Todos</option>
          <option value="pendente" ${filters.status==='pendente'?'selected':''}>Pendente</option>
          <option value="confirmado" ${filters.status==='confirmado'?'selected':''}>Confirmado</option>
          <option value="atrasado" ${filters.status==='atrasado'?'selected':''}>Atrasado</option>
        </select>
      </div>
      <button class="btn btn-ghost" onclick="clearFilters()">Limpar filtros</button>
    </div>

    ${filtered.length ? `
    <table class="data">
      <thead><tr>
        <th>Nº</th><th>Data</th><th>Cliente/Fornecedor</th><th>Material</th><th>Liberado por</th><th>Status</th><th>Recebido por</th>
      </tr></thead>
      <tbody>
        ${filtered.map(r=>{
          const s = getStatus(r);
          return `<tr class="row-click" onclick="openDetail(${r.id})">
            <td><strong>${pad4(r.id)}</strong></td>
            <td>${fmtDate(r.createdAt)}</td>
            <td>${r.cliente}</td>
            <td>${resumoItens(r)}</td>
            <td>${r.entreguePor}</td>
            <td><span class="badge ${s}"><span class="dot"></span>${statusLabel(s)}</span></td>
            <td>${r.confirmacao ? r.confirmacao.nomeRecebedor : '—'}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    ` : `
    <div class="card empty">
      <div class="display">Nenhuma remessa encontrada</div>
      <p>Ajuste os filtros ou registre uma nova remessa na aba acima.</p>
    </div>
    `}
  `;
}
function setFilter(k,v){ filters[k]=v; renderPainel(); }
function clearFilters(){ filters={from:'',to:'',q:'',status:''}; renderPainel(); }
window.setFilter=setFilter; window.clearFilters=clearFilters;

function applyFilters(list){
  return list.filter(r=>{
    if(filters.from && r.createdAt.slice(0,10) < filters.from) return false;
    if(filters.to && r.createdAt.slice(0,10) > filters.to) return false;
    if(filters.status && getStatus(r) !== filters.status) return false;
    if(filters.q){
      const q = filters.q.toLowerCase();
      const hay = (r.cliente + ' ' + r.itens.map(i=>i.discriminacao).join(' ')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function initSigPad(){
  const canvas = document.getElementById('sigpad');
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.strokeStyle = '#1A1C29';
  sigCtx.lineWidth = 2;
  sigCtx.lineCap = 'round';
  sigHasContent = false;

  const pos = e=>{
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const start = e=>{ sigDrawing=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); e.preventDefault(); };
  const move = e=>{ if(!sigDrawing) return; const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); sigHasContent=true; e.preventDefault(); };
  const end = ()=>{ sigDrawing=false; };

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSig(){
  const canvas = document.getElementById('sigpad');
  sigCtx.clearRect(0,0,canvas.width,canvas.height);
  sigHasContent = false;
}
window.clearSig = clearSig;

function handlePhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    capturedPhoto = reader.result;
    document.getElementById('photo-preview').innerHTML = `<img src="${capturedPhoto}" style="max-width:100%;margin-top:10px;border-radius:5px;border:1px solid var(--line);">`;
  };
  reader.readAsDataURL(file);
}
window.handlePhoto = handlePhoto;

async function confirmarRecebimento(id){
  const nome = document.getElementById('c-nome').value.trim();
  const documento = document.getElementById('c-doc').value.trim();
  if(!nome){ alert('Informe seu nome.'); return; }
  if(!documento){ alert('Informe o número do documento (RG/CPF).'); return; }
  if(!sigHasContent){ alert('É necessário assinar para confirmar o recebimento.'); return; }

  const rec = STATE.records.find(r=>r.id===id);
  const canvas = document.getElementById('sigpad');
  const assinatura = canvas.toDataURL('image/png');

  let geo = null;
  if(navigator.geolocation){
    try{
      geo = await new Promise((res)=>{
        navigator.geolocation.getCurrentPosition(
          p=>res({lat:p.coords.latitude, lng:p.coords.longitude}),
          ()=>res(null),
          {timeout:4000}
        );
      });
    }catch(e){ geo = null; }
  }

  rec.confirmacao = {
    nomeRecebedor: nome,
    documento,
    assinatura,
    foto: capturedPhoto,
    dataHora: new Date().toISOString(),
    geo
  };
  await saveState();
  capturedPhoto = null;
  render();
}
window.confirmarRecebimento = confirmarRecebimento;

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  await loadState();
  render();
})();
</script>
